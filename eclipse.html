<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECLIPSE: The Dragonbound Chronicles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--ob:#08090D;--nv:#111827;--au:#C5A46D;--sv:#C8CED8;--cr:#8B2635;--em:#205C4A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--ob);color:var(--sv);font:19px/1.6 'Cormorant Garamond',Georgia,serif;--a:#1b2233;--b:#08090D;background:radial-gradient(ellipse at 50% 15%,var(--a),transparent 65%),var(--b);transition:background 1s}
body[data-bg=title]{--a:#3a2a1a}body[data-bg=gate]{--a:#2a2433}body[data-bg=forest]{--a:#12332a;--b:#07100d}body[data-bg=ruin]{--a:#26262e;--b:#0a0a0e}body[data-bg=storm]{--a:#1d3a63;--b:#060a14}body[data-bg=void]{--a:#2b2f3a;--b:#020203}body[data-bg=end]{--a:#2a1a1f}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.fog{position:fixed;left:-30%;width:160%;height:40vh;bottom:0;background:radial-gradient(ellipse,rgba(200,206,216,.09),transparent 65%);filter:blur(30px);animation:dr 40s linear infinite alternate;pointer-events:none;z-index:1}
.fog+.fog{bottom:25vh;animation-duration:55s;animation-direction:alternate-reverse}
@keyframes dr{to{transform:translateX(14%)}}
.ecl{position:fixed;top:6vh;left:50%;width:min(34vw,220px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:#000;box-shadow:0 0 0 2px rgba(197,164,109,.55),0 0 70px 12px rgba(197,164,109,.22);z-index:0;opacity:.85}
#app{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:18px 16px 40px;min-height:100vh}
h1,h2,.ch{font-family:Cinzel,Georgia,serif;font-weight:500;color:var(--au);text-transform:uppercase}
.ttl{text-align:center;padding-top:30vh}
.ttl h1{font-size:clamp(2.6rem,11vw,5.4rem);letter-spacing:.3em;margin:0 0 0 .3em;font-weight:700}
.ttl h2{font-size:clamp(.9rem,3vw,1.2rem);letter-spacing:.35em;margin:.2em 0 1.4em;color:var(--sv)}
.tag{font-style:italic;max-width:30em;margin:0 auto 2em;font-size:1.15rem}
.menu{display:grid;gap:12px;max-width:340px;margin:auto}
.drg{position:fixed;top:11vh;left:-30%;width:26%;min-width:120px;fill:#000;opacity:.9;animation:fly 38s linear infinite;z-index:1}
@keyframes fly{to{left:110%}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.ch{font-size:.72rem;letter-spacing:.2em;opacity:.85;margin:0}
.ic{background:none;border:1px solid rgba(197,164,109,.35);color:var(--sv);font:inherit;font-size:.85rem;padding:3px 10px;border-radius:4px;cursor:pointer;margin-left:4px}
.panel{background:rgba(8,9,13,.74);border:1px solid rgba(197,164,109,.25);border-radius:6px;padding:26px 22px;backdrop-filter:blur(6px);margin-top:12vh}
.txt p{font-size:1.18rem;line-height:1.75;margin:0 0 1em}
.opts,.grid{display:grid;gap:10px;margin-top:20px}
.opt{font:inherit;font-size:1.05rem;color:var(--sv);text-align:left;background:rgba(17,24,39,.8);border:1px solid rgba(197,164,109,.45);border-radius:4px;padding:12px 16px;cursor:pointer;transition:transform .25s,background .25s,border-color .25s}
.opt:hover:not(:disabled),.opt:focus-visible,.opt.on{background:rgba(197,164,109,.16);border-color:var(--au);transform:translateY(-2px);outline:none}
.opt.sel{background:var(--au);color:#08090D;transform:scale(.98)}
.opt:disabled{opacity:.35;cursor:not-allowed}
.ttl .opt{text-align:center;text-transform:uppercase;letter-spacing:.2em;font-size:.9rem}
.in{animation:fi .8s both}.out{animation:fo .5s both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}}@keyframes fo{to{opacity:0;transform:translateY(-8px)}}
input{width:100%;font:inherit;font-size:1.1rem;background:rgba(17,24,39,.8);color:var(--sv);border:1px solid rgba(197,164,109,.45);border-radius:4px;padding:10px 14px}
label,.lb{display:block;font-family:Cinzel,serif;font-size:.78rem;letter-spacing:.2em;color:var(--au);margin:20px 0 6px;text-transform:uppercase}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{color:#d77;min-height:1.4em;font-size:.95rem}
.end{text-align:center}.end h2{font-size:1.8rem;margin:.2em 0}
.orb{width:84px;height:84px;margin:10px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--c),#000 75%);box-shadow:0 0 40px var(--c)}
.meta{text-align:left;font-size:1rem;border-top:1px solid rgba(197,164,109,.25);border-bottom:1px solid rgba(197,164,109,.25);padding:10px 0;margin:14px 0}
.meta b{color:var(--au);font-weight:600}
#ov{position:fixed;inset:0;z-index:9;background:rgba(2,2,4,.88);overflow:auto;padding:20px 14px}
#ov .panel{max-width:720px;margin:0 auto;background:#0d111b}
#ov h3{font-family:Cinzel,serif;color:var(--au);font-size:.95rem;letter-spacing:.18em;margin:1.4em 0 .4em;text-transform:uppercase}
#ov p,#ov li{font-size:1rem;margin:.3em 0}#ov li{list-style:none}.dim{opacity:.5}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){body{font-size:17px}.panel{padding:20px 16px}.row{grid-template-columns:1fr}}
</style></head><body>
<div class="ecl"></div><canvas id="fx"></canvas><div class="fog"></div><div class="fog"></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app'),KEY='eclipse-save',MK='eclipse-meta';
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const sv=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,wait=ms=>new Promise(r=>setTimeout(r,ms));
let S=null,D={name:'',g:'',m:''},busy=0,au,sOn=0,M=Object.assign({end:[],lore:[],seen:[]},ld(MK,{}));
const T=['cou','mer','ind','loy','amb','wis'],MOT={pow:'amb',pro:'loy',tru:'wis',wor:'cou'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st=()=>S.g==='m'?'Nyra':'Kael',t=k=>S.t[k],f=k=>S.f[k];
const fate=()=>f('killed')?'killed':f('spared')?'spared':f('bound')?'bound':f('handed')?'handed':'avoided';
const see=(k,v)=>{if(!M[k].includes(v)){M[k].push(v);sv(MK,M)}};
const fmt=s=>s.replace(/\{n\}/g,esc(S.name)).replace(/\{st\}/g,st());
const CH={1:'Chapter I · The Gates of Ash',2:'Chapter II · Blood Beneath the Pines',3:'Chapter III · The Divided Path',4:'Chapter IV · The Hour Without Light',5:'Chapter V · The Stranger in Black',6:'Chapter VI · The Storm’s Judgment',7:'Secret Chapter VII · The One Who Outlived Death'};
const BG={1:'gate',2:'forest',3:'forest',4:'ruin',5:'ruin',6:'storm',7:'void'};
const DR={green:{n:'Elyndra',c:'Green',col:'#2f8f6e',v:'Patience, loyalty, cooperation, wisdom'},red:{n:'Rhazek',c:'Red',col:'#b3303f',v:'Courage, ambition, boldness, decisive action'},blue:{n:'Seryth',c:'Blue',col:'#3b6fb6',v:'Bravery, compassion, restraint, integrity'},black:{n:'Veyrath',c:'Black',col:'#C8CED8',v:'Independence, courage, integrity, and the will to refuse power'}};
const L={trial:['The Eclipse Trial','Every hundred years the Forbidden Valley opens beneath an eclipse. Some candidates return with dragons. Some return without. Many do not return.'],before:['The Unfirst','Carvings speak of a creature that watched the first dragon kingdoms rise, and of riders who offered it crowns it refused.'],whisper:['The Nameless Hour','In the forgotten forest, something older than the Covenant speaks your name. It does not demand an answer. It waits to hear whether you give one.'],panel:['The Kneeling Rider','A panel shows a rider offering a crown to a vast shadow, and the shadow turning away. The meaning is not carved.'],covenant:['The Covenant of Ash','The old agreement: dragons chose riders and lent them power. A war broke it. Its guardians never stopped keeping watch.']};
const VQ=()=>({killed:'“You killed in the hollow. Was it justice, or anger wearing justice’s coat?”',spared:'“You spared them. Was it compassion, or the weakness of those who cannot bear consequence?”',bound:'“You bound them and left. Neither mercy nor justice. Tell me why.”',handed:'“You gave their fate to another. Was that wisdom, or a way to keep your hands clean?”',avoided:'“You looked away while the weak were hunted. Tell me why.”'}[fate()]);
const FT=()=>({killed:'He remembered the blood you spilled beneath the pines, and how you carried it.',spared:'He remembered the mercy you chose beneath the pines, and what it cost.',bound:'He remembered the attackers you bound and left, neither merciful nor cruel.',handed:'He remembered that you gave judgment to those it belonged to.',avoided:'He remembered the cries you walked away from, and that you never pretended otherwise.'}[fate()]);
const elig=()=>f('helped')&&t('ind')+t('cou')>=5&&t('wis')>=2;
const judge=()=>f('nopower')&&t('ind')+t('cou')+t('wis')+(f('owned')?1:0)>=9?'!black':'!reject';
/* scene: [text|fn, [[label, target|fn, effects]]] ; targets starting with "!" are endings */
const A={
s1:[`The Forbidden Valley yawns beyond gates of black iron, and above them the sun is slipping behind the moon. Hundreds of candidates crowd the ash-grey plain, whispering, praying, sharpening blades they may not live to use.\nAn elderly commander mounts the stair. “Beyond these gates, your title means nothing. Your bloodline means nothing. Only the dragons decide who returns.”\nHis eyes rest on you, {n}, a heartbeat too long. Then the gates groan open.`,[['Enter alone','s1b',{ind:1,f:'alone',l:'trial'}],['Enter with one companion, a quiet archer named Tomas','s1b',{loy:1,l:'trial'}],['Join the great crowd moving as one','s1b',{loy:1,l:'trial'}]]],
s1b:[`The forest beyond is wrong. Pines stand scorched to charcoal, claw-marks gouged at the height of a house. Somewhere deep, a roar rolls through the valley and every bird falls silent. You pass a shredded pack, a snapped sword, a boot with no one in it.\nAt a stream, a young wyrm drinks, its scales slate-grey, its wings still too large for its body. It has not seen you.`,[['Charge it before it can flee','s1c',{cou:1,f:'rash'}],['Lower your weapon and ease forward, hand open','s2',{wis:1,mer:1}],['Stay hidden and study it','s2',{wis:1}]]],
s1c:[`The wyrm shrieks and whips about. A wingclaw rakes your shoulder before you can raise your guard, and it scatters into the trees, more frightened than you.\nBlood runs warm beneath your sleeve. The valley has taught its first lesson, and left a scar to remember it by.`,[['Bind the wound and press on','s2',{cou:1,f:'scar'}]]],
s2:[`Screams ring between the trunks. In a hollow, two hulking candidates in crimson sashes have cornered three weaker ones, stripping their packs and dragon-charms. A girl is already on her knees.\n“The valley decides who returns,” the taller one laughs. “We’re only helping it decide.”`,[['Intervene','s2c',{cou:1}],['Observe and assess the situation','s2o',{wis:1}],['Avoid the confrontation','s3',{ind:1,f:'avoided'}]]],
s2o:[`You count them: two attackers, blades dull from use, one favouring a bad knee. The prisoners are not hopeless; the boy at the back is palming a knife. Thirty heartbeats, and the odds have changed.`,[['Strike while they are distracted','s2c',{cou:1}],['Slip away unseen','s3',{ind:1,f:'avoided'}]]],
s2c:[`Steel rings. The taller attacker comes fast while the other circles for your back. A blade grazes your ribs.\n{n}, you have one breath to decide.`,[['Cut down the leader','s2d',{cou:1}],['Disarm him and twist the sword free','s2d',{wis:1}],['Throw yourself between the blade and the prisoners','s2d',{mer:1,loy:1}]]],
s2d:[`Both attackers lie in the leaf-litter, beaten and bleeding. The one at your feet gasps apologies he does not mean. The rescued candidates stare at you, shaking. Silence waits for your verdict.`,[['Spare them','s3',{mer:1,f:'spared'}],['Restrain them and leave','s3',{wis:1,f:'bound'}],['Kill them yourself','s3',{amb:1,f:'killed'}],['Let the rescued decide their fate','s3',{loy:1,wis:1,f:'handed'}]]],
s3:[()=>`The survivors gather at the edge of the hollow. ${{killed:'They keep their distance from your blade; one will not meet your eyes.',spared:'The attackers limp away, and no one is sure you were right.',bound:'The attackers curse you from the pine they are tied to.',handed:'Their verdict was quick and quiet. None of you speaks of it.',avoided:'You find them later, shaken, sharing a story you were not part of.'}[fate()]}\n“Travel with us,” says Isolde, the girl from the hollow. “The valley eats the lonely.”\nBeyond the clearing a second path climbs away, narrow and unmarked, between trees that grow older with every step.`,[['Travel with the group','s3g',{loy:1}],['Continue alone, up the unmarked path','s3a',{ind:1}]]],
s3g:[`Dusk thickens. By the fire, Brannoc, wounded in the leg, admits he cannot walk far. Thunder grumbles. A green gleam pulses between the oaks to the west, and to the east a red glow climbs the hillside like a forge door opening.\nTwo dragons are near, and the group is torn.`,[['Carry Brannoc and wait in the green hollow','s3h',{loy:1,mer:1}],['Climb toward the red glow, leaving the slow behind','s3r',{cou:1,amb:1}],['Scout the green light alone, then return for them','s3h',{wis:1,loy:1}]]],
s3h:[()=>`Elyndra waits among the oaks, scales moss-green, eyes patient as old rain. She watches who comes first, and who comes carrying someone.`,[['Kneel and ask for nothing','!x',{wis:1,d:'green'}],['Speak of the friends waiting behind you','!y',{loy:1,d:'green'}],['Step back; a dragon you must earn is not one you take','!none',{ind:1,d:'green'}]]],
s3r:[`Rhazek stands on a ledge of cooling slag, smoke curling from his ribs. He does not look down. The ground is hot through your boots, and behind you the band’s voices fade.`,[['Climb to him and name what you want','!r1',{amb:1,d:'red'}],['Hold your ground and let him come','!r2',{cou:1,d:'red'}],['Retreat to the group','s3h',{loy:1,d:'red'}]]],
s3a:[`You leave the hollow alone. An hour passes, and the forest empties of sound, first the insects, then the wind. Trees thicken with age until their bark is cold as stone. Your footsteps feel loud enough to be a crime.\nBehind you, every voice is gone.`,[['Continue steadily','s4',{}],['Cut marks into the bark so you can find your way back','s4',{wis:1}]]],
s4:[`The path ends at a wall of fog. Beyond it, black monuments lean out of the white, carved in a script older than Vaeloria. No birds. No wind.\nSomewhere, very softly, a voice says your name.\n“{n}.”`,[['Read the inscriptions','s4b',{wis:1,l:'before'}],['Answer the whisper aloud','s4b',{cou:1,l:'whisper'}],['Skirt the monuments, touching nothing','s4b',{wis:1}]]],
s4b:[`The carvings speak of “the Unfirst,” a creature that stood before the first dragon kingdoms and watched them rise. One panel shows a rider kneeling before an enormous shadow, offering a crown, and the shadow turning away.\nThe whisper comes again, closer. Ahead, slumped against a stone, sits a figure dressed entirely in black.`,[['Go to the figure','s5',{}],['Copy the panel into your journal first','s5',{wis:1,l:'panel'}]]],
s5:[`{st} is hooded in black wool, one sleeve soaked dark, an arm held rigid. “Don’t,” says {st}, though the voice has no strength behind it. “Not unless you mean it.”\nTheir eyes keep going to the fog, then to you, then to the carvings, as if you had trespassed somewhere sacred. They will not give a name beyond that one, a house, or a reason.`,[['Help the stranger','s5h',{mer:1,loy:1,f:'helped'}],['Question the stranger before helping','s5q',{wis:1}],['Leave the stranger behind','s5L',{ind:1}]]],
s5q:[`“Ask,” says {st}. “It costs minutes I do not have.” They know the script on the stones, the Covenant, the names of dragons struck from the histories. Pressed on who they are, they answer: “Someone who stayed when others left.”\nBlood drips from their sleeve onto the root.`,[['Bind the wound','s5h',{loy:1,f:'helped'}],['Walk away; there are too many secrets','s5L',{}]]],
s5L:[`You step into the fog. Behind you, thunder with no cloud. A blue shadow crosses the trees and Seryth lands, wings wreathed in lightning.\n“You leave the helpless,” he says inside your skull, “and walk into my storm.”`,[['Stand your ground','!sg',{d:'blue'}],['Run','!death',{d:'blue'}],['Turn back and help the stranger, in front of him','s5h',{mer:1,f:'helped',d:'blue'}]]],
s5h:[`You bind the arm with strips of your cloak. {st} watches your hands, not your face. “Most would have taken my cloak and left me,” they murmur.\nSlowly the guard lowers: talk of the Covenant of Ash, of dragons that chose and were chosen, and of one who never had to choose, because no mortal had ever been brave enough to be refused.\nWhen you stand, {st} grips your wrist. “Some dragons choose riders. Others wait for someone willing to walk past the power they are offered.”\nThe sky rumbles. A storm is coming for you.`,[['Walk on toward the thunder','s6',{l:'covenant'}]]],
s6:[`Lightning stitches the clouds above a ridge of black rock. Seryth coils there, blue as deep ice, each scale spitting sparks, eyes like drawn swords. The air tastes of metal.\n“Little rider. You walk into my storm. Why should I not unmake you?”`,[['Bow your head and say you came with no claim','s6b',{mer:1,wis:1,d:'blue'}],['Meet his gaze and say nothing','s6b',{cou:1,d:'blue'}],['Demand that he kneel before a rider','!death',{amb:1,d:'blue'}]]],
s6b:[`The lightning dies. Seryth lowers his horned head until you see yourself in an eye the size of a shield. “Courage and respect in one breath. Rare.” A bond hums between you, warm and true. “Take it. I will carry you through every storm.”\nYet in the pause you feel another stillness deeper in the trees, like a held breath. You cannot know whether anything waits there at all.`,[['Accept the bond with Seryth','!blue',{}],['Refuse with respect and walk deeper into the forest',()=>elig()?'s7':'!none',{ind:1,f:'refused'}]]],
s7:[`The map ends. The forest falls so silent you hear your own blood. The sky darkens until the eclipse stands naked above a ruined sanctuary, pillars broken like ribs, steps worn by feet that stopped coming.\nA voice enters your mind, ancient and unhurried: “You have walked beyond the paths of the living. Tell me, little mortal, what is it you seek?”`,[['The truth about dragons and the Covenant','s7b',{wis:1}],['Nothing. Only to see if the dark is as terrible as they say','s7b',{ind:1,cou:1}],['A power no one can take from me','s7b',{amb:1}],['Someone to stand beside, not beneath','s7b',{loy:1,mer:1}]]],
s7b:[()=>`Obsidian scales rise out of the dark, vast as a cathedral, scarred by wars no history remembers. Silver eyes open. His wings spread and the moonlight dies in them. Veyrath, the Immortal, studies you as one studies a coin pulled from a well.\n${VQ()}${f('helped')?'\n“And the wounded stranger. You helped without expecting reward. That, I noted.”':''}`,[['“I act, and I answer for what I do.”','s7c',{cou:1,f:'owned',d:'black'}],['“I acted from what I believed. I may have been wrong.”','s7c',{wis:1,mer:1,f:'owned',d:'black'}],['“It was necessary. I would do it again.”','s7c',{cou:1,d:'black'}]]],
s7c:[`The silver eyes narrow. Power gathers like heat before a storm.\n“Then choose. I can give you what the others were offered: a throne, an army, a name the world will kneel to. Take it, and my strength is yours.”\nAt your feet, light shapes itself into a crown.`,[['Take the power','!doom',{amb:1}],['Refuse the crown','s7j',{ind:1,f:'nopower'}],['Ask what he would choose for you','!reject',{}]]]
};
A.s7j=[`“Refused.” The word is soft. Veyrath lowers his head until his breath moves your hair, and for a long time he only looks, weighing every choice you made to reach this stair.`,[['Hold his gaze','judge',{}]]];
const E={
black:{t:'Legendary Black Dragon Bond',dr:'black',lin:'The Unfirst Line, older than the Covenant of Ash',per:'Ancient, patient, merciless to flattery and gentle to honest doubt',title:'Dragonbound of the Last Light',x:()=>`Silver light rises through the broken pillars as Veyrath lowers his head to yours. No crown. No throne. A bond older than kingdoms settles in your chest like a second heartbeat, and the eclipse breaks open into dawn. ${FT()} The realm will call you ${esc(S.name)}, Dragonbound of the Last Light, though only you will know it began with refusing the very power you were offered.`},
blue:{t:'Blue Dragon Bond',dr:'blue',lin:'The Stormwing Line of the northern ridges',per:'Fierce, exacting, loyal to those who show courage and restraint',title:'Stormbound Rider of Vaeloria',x:()=>`Lightning folds back into the clouds as Seryth lowers his wings around you. ${esc(S.name)}, you ride out of the valley under a clearing sky, the great houses waiting at the gates. You will never know what waited beyond the eclipse. Some sacrifices are only visible in hindsight.`},
red:{t:'Red Dragon Bond',dr:'red',lin:'The Emberforge Line',per:'Proud, bold, impatient with hesitation',title:'Flamebearer of the Ashen Plain',x:()=>`Rhazek’s fire does not burn you; it recognises you. You ride from the valley at the head of astonished candidates, sparks falling in your wake, and the hunger he sees in you answers his own. Power makes a loud companion, but never a lonely one.`},
green:{t:'Green Dragon Bond',dr:'green',lin:'The Rootbound Line of the old oaks',per:'Patient, watchful, steady as the seasons',title:'Warden of the Green Covenant',x:()=>`Elyndra lowers her head into the falling leaves and the grove exhales. You return to the gates with a dragon of moss and thunder behind you and the quiet knowledge that you did not walk alone.`},
death:{t:'Death During the Trial',dr:null,title:'Fallen in the Forbidden Valley',x:()=>`The valley takes you quietly. No chronicle records your name; the commander at the gates only marks one more empty place in the ranks. Ash drifts over the last page of your story. The dragons remember who tried.`},
none:{t:'Survival Without a Dragon',dr:null,title:'Survivor of the Eclipse Trial',x:()=>`You walk out of the Forbidden Valley unbonded and alive. The commander does not smile, and the gates close at your back. ${f('refused')?'Behind you, the forest stays silent, as though something had waited, and been refused, or had refused you.':''} You carry something rarer than a dragon: your life, and the knowledge of what you were willing to walk away from.`},
reject:{t:'Rejected by the Black Dragon',dr:null,title:'The Unchosen Wanderer',x:()=>`Veyrath watches you a long moment. “Not yet,” he says. “Perhaps not in this life.” The sanctuary dissolves into fog and you wake at the valley’s edge, unharmed, with the memory of silver eyes and a question you could not fully answer. The dragon remains alone, for now.`},
doom:{t:'Condemned by the Black Dragon',dr:null,title:'Crowned by the Dark',x:()=>`You reach for the crown, and the crown reaches back. Veyrath’s voice is not cruel, only final: “So it is always the throne.” The eclipse closes like a fist over the sanctuary. A year later they find your cloak at the gates, neatly folded, and nothing else.`}};
const R={'!x':()=>t('loy')+t('wis')>=5?'!green':'!none','!y':()=>t('loy')>=4?'!green':'!none','!r1':()=>t('cou')+t('amb')>=5?'!red':'!death','!r2':()=>t('cou')>=3?'!red':'!death','!sg':()=>t('cou')>=3?'!none':'!death',judge};
function title(){document.body.dataset.bg='title';const c=!!ld(KEY,null);
app.innerHTML=`<div class="ttl in"><svg class="drg" viewBox="0 0 200 60" aria-hidden="true"><path d="M100 30 L8 4 L62 28 L28 52 L90 36 L100 54 L110 36 L172 52 L138 28 L192 4Z"/></svg><h1>Eclipse</h1><h2>The Dragonbound Chronicles</h2><p class="tag">“Not every soul is chosen. Not every dragon wishes to be found.”</p><div class="menu"><button class="opt" data-a="new">Begin your journey</button><button class="opt" data-a="cont" ${c?'':'disabled'}>Continue journey</button><button class="opt" data-a="chron">The Chronicles</button></div></div>`}
function create(){D={name:'',g:'',m:''};document.body.dataset.bg='gate';
const mo=[['pow','To become powerful'],['pro','To protect those I love'],['tru','To discover the truth about dragons'],['wor','To prove that I am worthy']];
app.innerHTML=`<section class="panel in"><h2 style="margin:0">Who Enters the Valley?</h2><label for="nm">Your name</label><input id="nm" maxlength="20" autocomplete="off"><div class="lb">You are</div><div class="row"><button class="opt" data-a="g" data-v="m">Male</button><button class="opt" data-a="g" data-v="f">Female</button></div><div class="lb">Why do you enter the trial?</div><div class="grid" style="margin:0">${mo.map(m=>`<button class="opt" data-a="m" data-v="${m[0]}">${m[1]}</button>`).join('')}</div><p class="hint" id="hint"></p><div class="row"><button class="opt" data-a="title">Back</button><button class="opt" data-a="go">Enter the gates</button></div></section>`}
function scene(){const n=S.id[1],d=A[S.id];document.body.dataset.bg=BG[n];
const tx=typeof d[0]==='function'?d[0]():d[0];
app.innerHTML=`<div class="top"><span class="ch">${CH[n]}</span><span><button class="ic" data-a="chron">Journal</button><button class="ic" data-a="snd">Sound: ${sOn?'on':'off'}</button></span></div><section class="panel in"><div class="txt">${fmt(tx).split('\n').map(p=>`<p>${p}</p>`).join('')}</div><div class="opts">${d[1].map((o,i)=>`<button class="opt" data-a="opt" data-v="${i}">${o[0]}</button>`).join('')}</div></section>`;scrollTo(0,0)}
function go(to){if(R[to])to=R[to]();if(to[0]==='!')return fin(to.slice(1));S.id=to;sv(KEY,S);scene()}
function fin(id){const e=E[id];S.end=id;sv(KEY,null);if(!M.end.includes(id))M.end.push(id);if(e.dr)see('seen',e.dr);sv(MK,M);
document.body.dataset.bg=e.dr==='black'?'void':'end';const d=e.dr&&DR[e.dr];
app.innerHTML=`<section class="panel in end"><p class="ch">Ending · ${e.t}</p>${d?`<div class="orb" style="--c:${d.col}"></div><h2>${d.n}</h2>`:`<h2>${e.title}</h2>`}${d?`<div class="meta"><p><b>Colour:</b> ${d.c} Dragon</p><p><b>Lineage:</b> ${e.lin}</p><p><b>Personality:</b> ${e.per}</p><p><b>Your title:</b> ${e.title}</p></div>`:''}<div class="txt"><p>${e.x()}</p></div><div class="row"><button class="opt" data-a="new">Play again</button><button class="opt" data-a="chron">The Chronicles</button></div></section>`;scrollTo(0,0)}
async function pick(i,b){if(busy)return;busy=1;const o=A[S.id][1][i];b.classList.add('sel');
await wait(rm?0:420);$('.panel').classList.add('out');await wait(rm?0:480);
const fx=o[2]||{};for(const k in fx){const v=fx[k];if(T.includes(k))S.t[k]+=v;else if(k==='f')v.split(',').forEach(x=>S.f[x]=1);else if(k==='l')see('lore',v);else if(k==='d')see('seen',v)}
S.h.push(o[0]);const to=typeof o[1]==='function'?o[1]():o[1];go(to);busy=0}
function chron(){$('#ov')?.remove();const o=document.createElement('div');o.id='ov';
o.innerHTML=`<div class="panel" style="margin-top:2vh"><div class="top"><h2 style="margin:0;font-size:1.3rem">The Chronicles</h2><button class="ic" data-a="x">Close</button></div><h3>Dragons discovered</h3>${Object.values(DR).map((d,i)=>{const k=Object.keys(DR)[i];return M.seen.includes(k)?`<p><b style="color:${d.col}">${d.n}, the ${d.c} Dragon</b><br>${d.v}</p>`:`<p class="dim">Undiscovered dragon</p>`}).join('')}<h3>Endings (${M.end.length} of ${Object.keys(E).length})</h3><ul style="padding:0">${Object.keys(E).map(k=>`<li class="${M.end.includes(k)?'':'dim'}">${M.end.includes(k)?E[k].t:'???'}</li>`).join('')}</ul><h3>Lore</h3>${Object.keys(L).map(k=>M.lore.includes(k)?`<p><b>${L[k][0]}.</b> ${L[k][1]}</p>`:`<p class="dim">???</p>`).join('')}${S&&!S.end?`<h3>Your path so far</h3><ol style="padding-left:20px">${S.h.map(h=>`<li style="list-style:decimal">${h}</li>`).join('')}</ol>`:''}</div>`;document.body.appendChild(o)}
function snd(){try{if(!au){au=new(window.AudioContext||window.webkitAudioContext)();const g=au.createGain();g.gain.value=.04;g.connect(au.destination);[55,82.5,110.4].forEach(h=>{const o=au.createOscillator();o.type='sine';o.frequency.value=h;o.connect(g);o.start()});sOn=1}else{sOn=!sOn;sOn?au.resume():au.suspend()}}catch(e){}
document.querySelectorAll('[data-a=snd]').forEach(b=>b.textContent='Sound: '+(sOn?'on':'off'))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==='new')create();else if(a==='title'){S=null;title()}else if(a==='cont'){S=ld(KEY,null);S&&scene()}else if(a==='chron'){S=S||ld(KEY,null);chron()}else if(a==='x')$('#ov')?.remove();else if(a==='snd')snd();else if(a==='opt')pick(+v,b);
else if(a==='g'||a==='m'){D[a]=v;b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b))}
else if(a==='go'){D.name=$('#nm').value.trim();if(!D.name||!D.g||!D.m){$('#hint').textContent='Choose a name, your path, and your reason before entering.';return}
S={name:D.name,g:D.g,m:D.m,t:{cou:0,mer:0,ind:0,loy:0,amb:0,wis:0},f:{},h:[],id:'s1'};S.t[MOT[D.m]]+=2;sv(KEY,S);scene()}});
addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov')?.remove()});
const cv=$('#fx'),cx=cv.getContext('2d'),P=[];const rs=()=>{cv.width=innerWidth;cv.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<40;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.4,v:Math.random()*.25+.05,a:Math.random()*6});
function tick(){cx.clearRect(0,0,cv.width,cv.height);cx.fillStyle='rgba(197,164,109,.4)';P.forEach(p=>{p.y-=p.v;p.x+=Math.sin(p.a+=.01)*.3;if(p.y<0){p.y=cv.height;p.x=Math.random()*cv.width}cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});requestAnimationFrame(tick)}
if(!rm)tick();
title();
</script></body></html>
